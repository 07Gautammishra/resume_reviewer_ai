<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="scanmycv-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8C4B3" />
      <stop offset="45%" stop-color="#5B7C6A" />
      <stop offset="85%" stop-color="#2F4A3A" />
      <stop offset="100%" stop-color="#1A2B21" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="scanmycv-inner-glow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A8C4B3" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#5B7C6A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0E1411" stop-opacity="0" />
    </radialGradient>

    <!-- Central Star Glow Filter -->
    <filter id="scanmycv-star-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Star Linear Gradient -->
    <linearGradient id="scanmycv-star-gradient" x1="15" y1="15" x2="49" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D2E8DC" />
      <stop offset="45%" stop-color="#80AA94" />
      <stop offset="100%" stop-color="#345441" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle with Dark Background and Sage Gradient Ring -->
  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="#0E1411"
    stroke="url(#scanmycv-border)"
    stroke-width="3"
  />

  <!-- Subtle Inner Atmosphere Glow -->
  <rect
    x="4.5"
    y="4.5"
    width="55"
    height="55"
    rx="14.5"
    fill="url(#scanmycv-inner-glow)"
  />

  <!-- Ambient Star Radial Glow Behind -->
  <circle cx="32" cy="32" r="14" fill="#A8C4B3" opacity="0.32" filter="url(#scanmycv-star-glow)" />

  <!-- ScanMyCv 4-Point AI Star -->
  <path
    d="M32 14 C32 23.9411 23.9411 32 14 32 C23.9411 32 32 40.0589 32 50 C32 40.0589 40.0589 32 50 32 C40.0589 32 32 23.9411 32 14 Z"
    fill="url(#scanmycv-star-gradient)"
    filter="url(#scanmycv-star-glow)"
  />

  <!-- Micro Center Sparkle Specular Highlight -->
  <circle cx="28" cy="28" r="1.2" fill="#FFFFFF" opacity="0.85" />
</svg>
