name: Gemini AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        id: pr_diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          head -c 45000 diff.txt > truncated_diff.txt

      - name: Review with Gemini
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            if (!process.env.GEMINI_API_KEY) {
              console.error("GEMINI_API_KEY secret is not set.");
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "⚠️ **Gemini Code Reviewer**: Please set `GEMINI_API_KEY` in repository **Settings → Secrets and variables → Actions** to enable AI code reviews."
              });
              return;
            }

            const diff = fs.readFileSync('truncated_diff.txt', 'utf8');
            if (!diff.trim()) {
              console.log("Empty diff; skipping review.");
              return;
            }

            const prompt = `You are an expert full-stack code reviewer evaluating a Pull Request for ScanMyCV (React + Vite + Tailwind CSS frontend, Express + MongoDB + Google GenAI backend).

            Review the code diff below:
            \`\`\`diff
            ${diff}
            \`\`\`

            Provide a clear, structured review using this format:
            ### 📌 Summary
            Brief overview of the changes introduced.

            ### 🔍 Key Observations & Potential Issues
            - Critical bugs, logic errors, or edge cases.
            - Security concerns (leaked secrets, improper input validation, auth/cors).
            - Code quality, readability, or performance suggestions.

            ### 💡 Suggestions
            Actionable recommendations to improve the code.

            ### ✅ Verdict
            **LGTM (Looks Good To Me)** or **Needs Attention** with a one-line reason.`;

            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }],
                  generationConfig: {
                    temperature: 0.2
                  }
                })
              });

              const data = await response.json();

              if (!response.ok) {
                throw new Error(data.error?.message || `API error ${response.status}`);
              }

              const review = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (!review) {
                throw new Error("No review text generated.");
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `### 🤖 Gemini AI Code Review\n\n${review}`
              });
            } catch (err) {
              console.error("Failed to generate or post review:", err);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Gemini Code Reviewer encountered an error:** ${err.message}`
              });
            }
